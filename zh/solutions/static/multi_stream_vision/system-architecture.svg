<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">多路视频分析系统架构</title>
  <desc id="desc">按应用与呈现、输入与管理、多路视频分析、运行框架、系统和硬件六层展示系统架构。网络视频流以虚线连接 MPP，表示当前暂未支持。</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="145%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#21364D" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#65768A"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3F7FC4"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#CE5962"/>
    </marker>
    <style>
      .page-title { font: 600 40px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #20334A; }
      .page-subtitle { font: 400 16px "Segoe UI", sans-serif; fill: #738399; letter-spacing: 2px; }
      .layer-title { font: 600 23px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #34465A; }
      .number { font: 600 17px "Segoe UI", sans-serif; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
      .box-title { font: 600 19px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #25394F; text-anchor: middle; }
      .box-sub { font: 400 14px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #67788C; text-anchor: middle; }
      .legend { font: 400 14px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #8B4C53; }
      .layer { stroke-width: 1.6; }
      .box { fill: #FFFFFF; stroke: #8FA0B4; stroke-width: 1.5; filter: url(#shadow); }
      .blue-box { fill: #FFFFFF; stroke: #74A2D4; stroke-width: 1.6; filter: url(#shadow); }
      .green-box { fill: #FFFFFF; stroke: #78AE8D; stroke-width: 1.6; filter: url(#shadow); }
      .gold-box { fill: #FFFFFF; stroke: #D5AA55; stroke-width: 1.6; filter: url(#shadow); }
      .red-box { fill: #FFFFFF; stroke: #D48B90; stroke-width: 1.6; filter: url(#shadow); }
      .layer-arrow { fill: none; stroke: #7E8D9E; stroke-width: 2.1; marker-end: url(#arrow); }
      .source-arrow { fill: none; stroke: #3F7FC4; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .network-arrow { fill: none; stroke: #CE5962; stroke-width: 2.4; stroke-dasharray: 9 7; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="#F7F9FC"/>
  <rect x="30" y="24" width="1740" height="1150" rx="20" fill="#EFF4FA" stroke="#BCC9D8" stroke-width="2"/>

  <text x="900" y="70" class="page-title" text-anchor="middle">多路视频分析系统架构</text>
  <text x="900" y="98" class="page-subtitle" text-anchor="middle">MULTI-STREAM VIDEO ANALYTICS · SPACEMIT K3</text>

  <!-- 01 应用与呈现层 -->
  <rect x="65" y="125" width="1670" height="130" rx="14" fill="#EEE7F7" stroke="#B9A1D5" class="layer"/>
  <circle cx="105" cy="163" r="18" fill="#8868B0"/>
  <text x="105" y="164" class="number">01</text>
  <text x="136" y="170" class="layer-title">应用与呈现层</text>

  <rect x="375" y="156" width="280" height="70" rx="10" class="box"/>
  <text x="515" y="185" class="box-title">Qt5 应用界面</text>
  <text x="515" y="210" class="box-sub">控制、配置与生命周期</text>
  <rect x="760" y="156" width="280" height="70" rx="10" class="box"/>
  <text x="900" y="185" class="box-title">多路视频网格</text>
  <text x="900" y="210" class="box-sub">4 / 9 / 12 路 OpenGL 显示</text>
  <rect x="1145" y="156" width="280" height="70" rx="10" class="box"/>
  <text x="1285" y="185" class="box-title">运行统计</text>
  <text x="1285" y="210" class="box-sub">FPS、检测数与延迟</text>

  <path d="M900 255 V276" class="layer-arrow"/>

  <!-- 02 输入与管理层 -->
  <rect x="65" y="285" width="1670" height="150" rx="14" fill="#E4EFFB" stroke="#8CB3DD" class="layer"/>
  <circle cx="105" cy="323" r="18" fill="#4C86C4"/>
  <text x="105" y="324" class="number">02</text>
  <text x="136" y="330" class="layer-title">输入与管理层</text>

  <rect x="265" y="332" width="250" height="72" rx="10" class="blue-box"/>
  <text x="390" y="361" class="box-title">本地视频文件</text>
  <text x="390" y="386" class="box-sub">MP4 / TS / FLV</text>
  <rect x="570" y="332" width="250" height="72" rx="10" fill="#FFF7F7" stroke="#CE5962" stroke-width="1.8" stroke-dasharray="9 7" filter="url(#shadow)"/>
  <text x="695" y="361" class="box-title">网络视频流</text>
  <text x="695" y="386" class="box-sub">RTSP / RTMP / HTTP</text>
  <rect x="1020" y="332" width="250" height="72" rx="10" class="blue-box"/>
  <text x="1145" y="361" class="box-title">PipelineManager</text>
  <text x="1145" y="386" class="box-sub">多通道编排</text>
  <rect x="1325" y="332" width="250" height="72" rx="10" class="blue-box"/>
  <text x="1450" y="361" class="box-title">ModelManager</text>
  <text x="1450" y="386" class="box-sub">模型管理与切换</text>

  <line x1="570" y1="420" x2="600" y2="420" stroke="#CE5962" stroke-width="2.4" stroke-dasharray="9 7"/>
  <text x="612" y="425" class="legend">虚线：暂未支持</text>

  <!-- 03 多路视频分析层 -->
  <rect x="65" y="465" width="1670" height="220" rx="14" fill="#E5F3E9" stroke="#8FC39E" class="layer"/>
  <circle cx="105" cy="503" r="18" fill="#5A9A70"/>
  <text x="105" y="504" class="number">03</text>
  <text x="136" y="510" class="layer-title">多路视频分析层</text>

  <rect x="225" y="535" width="250" height="92" rx="10" class="green-box"/>
  <text x="350" y="570" class="box-title">MPP / VDEC</text>
  <text x="350" y="596" class="box-sub">解封装、硬件解码与缩放</text>
  <text x="350" y="618" class="box-sub">640×360 NV12 dma-buf</text>
  <rect x="535" y="535" width="250" height="92" rx="10" class="green-box"/>
  <text x="660" y="570" class="box-title">Pipeline × N</text>
  <text x="660" y="596" class="box-sub">每通道独立处理</text>
  <text x="660" y="618" class="box-sub">共享 K3 硬件资源</text>
  <rect x="845" y="535" width="250" height="92" rx="10" class="green-box"/>
  <text x="970" y="570" class="box-title">视频显示通路</text>
  <text x="970" y="596" class="box-sub">latest-only 帧交接</text>
  <text x="970" y="618" class="box-sub">Qt / OpenGL 渲染</text>
  <rect x="1155" y="535" width="340" height="92" rx="10" class="green-box"/>
  <text x="1325" y="570" class="box-title">AI 分析通路</text>
  <text x="1325" y="596" class="box-sub">OpenCL 前处理 → ONNX Runtime + EP</text>
  <text x="1325" y="618" class="box-sub">模型后处理与性能统计</text>

  <!-- 两类视频源都进入 MPP；网络流保持虚线 -->
  <path d="M390 404 V448 H315 V527" class="source-arrow"/>
  <path d="M695 404 V450 H385 V527" class="network-arrow"/>

  <path d="M900 685 V706" class="layer-arrow"/>

  <!-- 04 运行框架层 -->
  <rect x="65" y="715" width="1670" height="145" rx="14" fill="#FFF2D5" stroke="#E1B856" class="layer"/>
  <circle cx="105" cy="753" r="18" fill="#D39A2E"/>
  <text x="105" y="754" class="number">04</text>
  <text x="136" y="760" class="layer-title">运行框架层</text>

  <rect x="245" y="766" width="225" height="62" rx="10" class="gold-box"/>
  <text x="358" y="805" class="box-title">Qt5 / OpenGL</text>
  <rect x="515" y="766" width="225" height="62" rx="10" class="gold-box"/>
  <text x="628" y="805" class="box-title">SpacemiT MPP</text>
  <rect x="785" y="766" width="225" height="62" rx="10" class="gold-box"/>
  <text x="898" y="805" class="box-title">OpenCL Runtime</text>
  <rect x="1055" y="766" width="280" height="62" rx="10" class="gold-box"/>
  <text x="1195" y="792" class="box-title">ONNX Runtime</text>
  <text x="1195" y="816" class="box-sub">SpaceMIT Execution Provider</text>
  <rect x="1380" y="766" width="190" height="62" rx="10" class="gold-box"/>
  <text x="1475" y="805" class="box-title">OpenCV</text>

  <path d="M900 860 V881" class="layer-arrow"/>

  <!-- 05 系统层 -->
  <rect x="65" y="890" width="1670" height="100" rx="14" fill="#FFE9D5" stroke="#E3A263" class="layer"/>
  <circle cx="105" cy="928" r="18" fill="#D98139"/>
  <text x="105" y="929" class="number">05</text>
  <text x="136" y="935" class="layer-title">系统层</text>
  <rect x="650" y="914" width="500" height="52" rx="10" class="gold-box"/>
  <text x="900" y="947" class="box-title">Bianbu OS</text>

  <path d="M900 990 V1011" class="layer-arrow"/>

  <!-- 06 硬件层 -->
  <rect x="65" y="1020" width="1670" height="120" rx="14" fill="#F9DDDE" stroke="#D98C90" class="layer"/>
  <circle cx="105" cy="1058" r="18" fill="#C96167"/>
  <text x="105" y="1059" class="number">06</text>
  <text x="136" y="1065" class="layer-title">SpacemiT K3 硬件层</text>

  <rect x="400" y="1046" width="225" height="68" rx="10" class="red-box"/>
  <text x="513" y="1075" class="box-title">VPU</text>
  <text x="513" y="1099" class="box-sub">多路视频解码</text>
  <rect x="670" y="1046" width="225" height="68" rx="10" class="red-box"/>
  <text x="783" y="1075" class="box-title">GPU</text>
  <text x="783" y="1099" class="box-sub">OpenCL / OpenGL</text>
  <rect x="940" y="1046" width="225" height="68" rx="10" class="red-box"/>
  <text x="1053" y="1075" class="box-title">AI 计算资源</text>
  <text x="1053" y="1099" class="box-sub">8 块 TCM</text>
  <rect x="1210" y="1046" width="225" height="68" rx="10" class="red-box"/>
  <text x="1323" y="1075" class="box-title">DDR / dma-buf</text>
  <text x="1323" y="1099" class="box-sub">共享缓冲区</text>
</svg>
